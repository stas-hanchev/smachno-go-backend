services:
  - type: web
    name: smachnogo-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_CA
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: '5'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: VOUCHER_HMAC_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: BCRYPT_COST
        value: '10'
      - key: RUN_JOBS_IN_PROCESS
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: 'true'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYMENT_PROVIDER
        value: fake
      - key: ALLOW_FAKE_PAYMENTS
        value: 'true'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: staging
