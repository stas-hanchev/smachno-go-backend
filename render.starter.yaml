services:
  - type: web
    name: smachnogo-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: smachnogo-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smachnogo-redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: 'true'
      - key: RUN_JOBS_IN_PROCESS
        value: 'false'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: METRICS_TOKEN
        sync: false

  - type: worker
    name: smachnogo-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - fromGroup: smachnogo-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smachnogo-redis
          property: connectionString
      - key: APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false

  - type: keyvalue
    name: smachnogo-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

envVarGroups:
  - name: smachnogo-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: VOUCHER_HMAC_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: fake
      - key: ALLOW_FAKE_PAYMENTS
        value: 'true'
      - key: LIQPAY_PUBLIC_KEY
        sync: false
      - key: LIQPAY_PRIVATE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
